    <!-- First-paint boot splash. Pure CSS so it shows instantly, before
         React parses. The app removes #boot-splash once mounted. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background: #0b080c;
        color: #f4ede0;
        font-family: system-ui, -apple-system, sans-serif;
        opacity: 1;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
      }
      #boot-splash.is-leaving { opacity: 0; pointer-events: none; }
      #boot-splash::before,
      #boot-splash::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        pointer-events: none;
      }
      #boot-splash::before {
        width: 520px; height: 520px;
        background: radial-gradient(circle, rgba(194,164,255,0.4), transparent 60%);
        top: -120px; left: -120px;
      }
      #boot-splash::after {
        width: 600px; height: 600px;
        background: radial-gradient(circle, rgba(120,200,255,0.28), transparent 60%);
        bottom: -180px; right: -180px;
      }
      .bs-center {
        position: relative;
        display: flex; flex-direction: column; align-items: center; gap: 32px;
        z-index: 1;
      }
      .bs-eyebrow {
        font-size: 11px; letter-spacing: 2.4px; text-transform: uppercase;
        color: rgba(244,237,224,0.55);
        display: inline-flex; align-items: center; gap: 12px;
      }
      .bs-eyebrow::before, .bs-eyebrow::after {
        content: ""; width: 24px; height: 1px; background: rgba(244,237,224,0.3);
      }
      .bs-mark {
        width: clamp(64px, 9vw, 96px);
        height: clamp(64px, 9vw, 96px);
        color: #f4ede0;
      }
      .bs-mark svg { width: 100%; height: 100%; display: block; }
      .bs-mark path { stroke-dasharray: 100; stroke-dashoffset: 100; animation: bs-draw 1.1s cubic-bezier(0.65,0,0.35,1) forwards; }
      .bs-mark path.bs-cross { animation-delay: 0.45s; animation-duration: 0.6s; }
      .bs-mark circle { opacity: 0; animation: bs-dot 2.4s ease-in-out 1.1s infinite; transform-origin: 18px 7px; }
      @keyframes bs-draw { to { stroke-dashoffset: 0; } }
      @keyframes bs-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        10% { opacity: 1; transform: scale(1.1); }
        50% { opacity: 0.55; transform: scale(0.85); }
      }
      .bs-status {
        font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
        font-size: 12px; letter-spacing: 1.4px;
        color: rgba(244,237,224,0.65);
        display: inline-flex; align-items: center; gap: 10px;
      }
      .bs-dot {
        width: 6px; height: 6px; border-radius: 50%; background: #4cd964;
        box-shadow: 0 0 8px #4cd964;
        animation: bs-pulse 2s ease-in-out infinite;
      }
      @keyframes bs-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.4; transform: scale(0.85); }
      }
      .bs-bar {
        width: 220px; height: 2px;
        background: rgba(244,237,224,0.08); border-radius: 1px;
        overflow: hidden; position: relative;
      }
      .bs-bar::before {
        content: ""; position: absolute; inset: 0 auto 0 0;
        width: 30%;
        background: linear-gradient(90deg, transparent, rgba(244,237,224,0.6), transparent);
        animation: bs-glint 1.6s cubic-bezier(0.4,0,0.2,1) infinite;
      }
      @keyframes bs-glint {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bs-dot, .bs-bar::before, .bs-mark path, .bs-mark circle { animation: none; }
        .bs-mark path { stroke-dashoffset: 0; }
        .bs-mark circle { opacity: 1; }
        #boot-splash { transition: opacity 0.2s ease; }
      }
    </style>

    <script>
      // Fade out the boot splash once React has mounted something into #root.
      (function () {
        var splash = document.getElementById("boot-splash");
        if (!splash) return;
        var root = document.getElementById("root");
        // Fail-safe: never block past 8s even if React errors out.
        var hardTimeout = setTimeout(remove, 8000);
        function remove() {
          if (!splash) return;
          splash.classList.add("is-leaving");
          setTimeout(function () { splash && splash.remove(); }, 600);
          splash = null;
          clearTimeout(hardTimeout);
        }
        var obs = new MutationObserver(function () {
          if (root.firstElementChild) {
            obs.disconnect();
            // Wait one paint frame so the React tree's own animations get a head start.
            requestAnimationFrame(function () {
              setTimeout(remove, 60);
            });
          }
        });
        obs.observe(root, { childList: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
